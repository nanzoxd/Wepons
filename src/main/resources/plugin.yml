name: Wepons
version: 1.0.0
main: com.wepons.Wepons
api-version: '1.21'
description: Custom weapons with abilities, a weapon GUI and a holder tracker.
author: Wepons

commands:
  wepons:
    description: Open the weapons menu, or /wepons enchants for the enchantment dialog
    usage: /wepons [enchants]
    aliases: [weapons]
  holder:
    description: See who holds each weapon
    usage: /holder
    aliases: [holders]
    permission: wepons.holder

permissions:
  wepons.use:
    description: Open /wepons and take weapons from it
    default: op
  wepons.enchants:
    description: Edit the enchantment levels of the weapon in your hand (/wepons enchants)
    default: op
  wepons.holder:
    description: Open /holder
    default: true
